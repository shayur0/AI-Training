services:
  - type: web
    name: illumination-space-backend
    runtime: node
    rootDir: ./backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

  - type: web
    name: illumination-space-frontend
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
